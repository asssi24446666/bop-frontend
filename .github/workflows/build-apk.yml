name: Build BOP Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: https://bop-backend-production-a221.up.railway.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build web app
        run: npm run build
        working-directory: frontend

      - name: Add Android platform
        run: npx cap add android
        working-directory: frontend

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend

      - name: Add google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > frontend/android/app/google-services.json

      - name: Add Google Services Gradle plugin (project-level)
        run: |
          sed -i "s/classpath 'com.android.tools.build:gradle:.*'/&\n        classpath 'com.google.gms:google-services:4.4.2'/" frontend/android/build.gradle

      - name: Apply Google Services Gradle plugin (app-level)
        run: |
          echo "apply plugin: 'com.google.gms.google-services'" >> frontend/android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: frontend/android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bop-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          
